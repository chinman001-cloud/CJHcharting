<style>
:root { --primary-color: #0f4c81; --primary-light: #e8f0fe; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; --text-muted: #64748b; --border-color: #cbd5e1; --accent-color: #e67e22; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 15px; display: flex; justify-content: center; min-height: 100vh; }
.app-container { width: 100%; max-width: 1150px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; overflow: hidden; }
header { background-color: var(--primary-color); color: white; padding: 20px; text-align: center; position: relative; }
header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
header p { font-size: 13px; opacity: 0.9; }
.tab-container { display: flex; background: #e2e8f0; padding: 6px 6px 0 6px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
.tab-btn { flex: 1; min-width: 120px; padding: 12px 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 8px 8px 0 0; margin-right: 4px; margin-bottom: 4px; text-align: center; }
.tab-btn.active { background: var(--card-bg); color: var(--primary-color); border-top: 3px solid var(--primary-color); margin-bottom: 0; }
.main-content { padding: 24px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.grid-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
@media (min-width: 800px) { .grid-layout { grid-template-columns: 1.15fr 1fr; } }
.section-title { font-size: 14px; font-weight: 700; color: var(--primary-color); margin-bottom: 10px; border-bottom: 2px solid var(--primary-light); padding-bottom: 4px; }
.form-group { background: #f1f5f9; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; }
.tag-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.tag-btn { padding: 9px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: #ffffff; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text-color); transition: all .12s ease; }
.tag-btn:hover { background: var(--primary-light); border-color: var(--primary-color); }
.tag-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
.tag-btn.big { width: 100%; text-align: left; padding: 14px 16px; font-size: 13.5px; }
.tag-btn.accent.active { background: var(--accent-color); border-color: var(--accent-color); }
.subtab-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--border-color); }
.subtab-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-muted); }
.subtab-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
.desc-line { font-size: 11.5px; color: var(--text-muted); margin: -4px 0 10px 2px; }
.output-panel { display: flex; flex-direction: column; background: #fafafa; border: 1px dashed var(--border-color); border-radius: 8px; padding: 16px; }
.chart-textarea { width: 100%; height: 460px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12.5px; line-height: 1.5; resize: none; background-color: #ffffff; margin-bottom: 14px; white-space: pre-wrap; }
.btn-copy { background-color: var(--primary-color); color: white; border: none; padding: 14px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15, 76, 129, 0.95); color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; transition: transform 0.3s ease; z-index: 1000; opacity: 0; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.ref-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
.ref-table th, .ref-table td { border: 1px solid var(--border-color); padding: 6px 8px; text-align: left; }
.ref-table th { background: var(--primary-light); color: var(--primary-color); font-size: 12px; }
.note-box { background: #fff7ed; border: 1px dashed var(--accent-color); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.6; }
.note-box b { color: #9a3412; }
.info-box { background: #eaf2fb; border: 1px dashed var(--primary-color); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.6; color: #0f4c81; }
.info-box b { color: #0a3a63; }
.text-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 12.5px; margin-bottom: 10px; }
.inline-row { display: flex; gap: 8px; margin-bottom: 10px; }
.inline-row .text-input { margin-bottom: 0; }
</style>
</head>

const SITE_PASSWORD = "2575";
function tryUnlock(){
  const input = document.getElementById('lockPassword');
  const err = document.getElementById('lockError');
  if(input.value === SITE_PASSWORD){
    sessionStorage.setItem('chartToolUnlocked', 'yes');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = '';
    if(typeof checkForUpdateBadge === 'function') checkForUpdateBadge();
    if(typeof updateHeaderDate === 'function') updateHeaderDate();
  } else {
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

function mirrorPairs(text){ return text.replace(/([+\-0-9.]+)\/([+\-0-9.]+)/g, (m,a,b)=> b+'/'+a); }
function duplicateFirstPairs(text){ return text.replace(/([+\-0-9.]+)\/([+\-0-9.]+)/g, (m,a)=> a+'/'+a); }
function swapLR(text){ return text.replace(/[좌우]/g, ch => ch==='좌' ? '우' : '좌'); }
function bothLR(text){ return text.replace(/[좌우]/g, '양측'); }
const LR_PROTECT_WORDS = ["단순근육염좌"];
function protectLRWords(text){
  let out = text;
  LR_PROTECT_WORDS.forEach((w,i)=>{ out = out.split(w).join('§P'+i+'§'); });
  return out;
}
function restoreLRWords(text){
  let out = text;
  LR_PROTECT_WORDS.forEach((w,i)=>{ out = out.split('§P'+i+'§').join(w); });
  return out;
}
function examTextForSide(baseText, side){
  if(side === 'right') return restoreLRWords(swapLR(mirrorPairs(protectLRWords(baseText))));
  if(side === 'both') return restoreLRWords(bothLR(duplicateFirstPairs(protectLRWords(baseText))));
  return baseText;
}

/* =========================================================
   3. 공통 유틸
   ========================================================= */
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }

function tagBtn(label, active, onClick, extraCls){
  const b = el('button','tag-btn'+(extraCls?(' '+extraCls):'')+(active?' active':''), label);
  b.type='button';
  b.onclick = onClick;
  return b;
}

function setOutput(tabId, text){
  const ta = document.getElementById('out-'+tabId);
  if(ta) ta.value = text;
}

function copyText(tabId){
  const ta = document.getElementById('out-'+tabId);
  ta.select();
  try{ navigator.clipboard.writeText(ta.value).then(showToast); } catch(e){ document.execCommand('copy'); showToast(); }
}

function showToast(){ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function outputPanel(tabId, titleText){
  const wrap = el('div','output-panel');
  wrap.appendChild(el('div','section-title','📋 '+titleText+' 미리보기'));
  const ta = el('textarea','chart-textarea'); ta.id='out-'+tabId; ta.readOnly=true;
  wrap.appendChild(ta);
  const btn = el('button','btn-copy','차팅 텍스트 복사하기');
  btn.onclick=()=>copyText(tabId);
  wrap.appendChild(btn);
  return wrap;
}

function subTabBar(items, activeId, onSelect){
  const bar = el('div','subtab-bar');
  items.forEach(it=>{
    const b = el('button','subtab-btn'+(activeId===it.id?' active':''), it.label);
    b.type='button';
    b.onclick = ()=>onSelect(it.id);
    bar.appendChild(b);
  });
  return bar;
}

/* 단일 고정 문구를 보여주는 간단 탭(수기요법 서브카테고리에서 재사용) */
function renderFixedTextBlock(container, tabId, title, text){
  const grid = el('div','grid-layout');
  const input = el('div','input-panel');
  input.appendChild(el('div','section-title','■ '+title));
  input.appendChild(el('div','desc-line','* 단일 고정 문구입니다. 우측에서 바로 복사하세요.'));
  grid.appendChild(input);
  grid.appendChild(outputPanel(tabId, title));
  container.appendChild(grid);
  setOutput(tabId, text);
}

function renderCvaBlock(container){
  const grid = el('div','grid-layout');
  const input = el('div','input-panel');
  const c = state.cva;

  input.appendChild(el('div','section-title','■ 1. Mental Gr. (1개 선택)'));
  const mentalOpts = ['I. Alert, confusion','II. Drowsy, Stupor','III. Semicoma','IV. Coma'];
  const g1 = el('div','tag-group');
  mentalOpts.forEach(o=>g1.appendChild(tagBtn(o, c.mental===o, ()=>{ c.mental=o; container.innerHTML=''; renderers.insuranceChart(container); })));
  input.appendChild(g1);

  input.appendChild(el('div','section-title','■ 2. plegia 부위 (다중 선택) + 등급 (1개 선택)'));
  const locs = ['Rt. UE','Lt. UE','Rt. LE','Lt. LE'];
  const g2 = el('div','tag-group');
  locs.forEach(o=>{
    const active = c.plegiaLoc.includes(o);
    g2.appendChild(tagBtn(o, active, ()=>{
      if(active) c.plegiaLoc = c.plegiaLoc.filter(x=>x!==o); else c.plegiaLoc.push(o);
      container.innerHTML=''; renderers.insuranceChart(container);
    }));
  });
  input.appendChild(g2);
  const grades = ['weakness 소력 (Gr.4)','paresis 부전마비 (Gr.3)','paresis 부전마비 (Gr.2)','plegia 마비 (Gr.1)','plegia 마비 (Gr.0)'];
  const g2b = el('div','tag-group');
  grades.forEach(o=>g2b.appendChild(tagBtn(o, c.plegiaGrade===o, ()=>{ c.plegiaGrade=o; container.innerHTML=''; renderers.insuranceChart(container); })));
  input.appendChild(g2b);

  input.appendChild(el('div','section-title','■ 3. Dysarthria / Aphasia (다중 선택)'));
  const speechOpts = ['Dysarthria(어삽)','Aphasia(실어증)'];
  const g3 = el('div','tag-group');
  speechOpts.forEach(o=>{
    const active = c.speech.includes(o);
    g3.appendChild(tagBtn(o, active, ()=>{
      if(active) c.speech = c.speech.filter(x=>x!==o); else c.speech.push(o);
      container.innerHTML=''; renderers.insuranceChart(container);
    }));
  });
  input.appendChild(g3);

  input.appendChild(el('div','section-title','■ 4~6. Dysphagia / Dysuria / Dyspnea'));
  const g4 = el('div','tag-group');
  ['L/T keep 상태','해당없음(정상연하)'].forEach(o=>g4.appendChild(tagBtn(o, c.dysphagia===o, ()=>{ c.dysphagia=o; container.innerHTML=''; renderers.insuranceChart(container); })));
  input.appendChild(el('div','desc-line','4. Dysphagia'));
  input.appendChild(g4);
  const g5 = el('div','tag-group');
  ['F/C keep 상태','해당없음'].forEach(o=>g5.appendChild(tagBtn(o, c.dysuria===o, ()=>{ c.dysuria=o; container.innerHTML=''; renderers.insuranceChart(container); })));
  input.appendChild(el('div','desc-line','5. Dysuria'));
  input.appendChild(g5);
  const g6 = el('div','tag-group');
  ['T/C keep 상태','해당없음'].forEach(o=>g6.appendChild(tagBtn(o, c.dyspnea===o, ()=>{ c.dyspnea=o; container.innerHTML=''; renderers.insuranceChart(container); })));
  input.appendChild(el('div','desc-line','6. Dyspnea'));
  input.appendChild(g6);

  input.appendChild(el('div','section-title','■ 7. 기타 호소 증상 (직접입력)'));
  const etcInput = el('input','text-input'); etcInput.type='text'; etcInput.value=c.etc; etcInput.placeholder='기타 호소 증상을 입력하세요';
  etcInput.oninput = (e)=>{ c.etc = e.target.value; setOutput('cva', buildCvaText()); };
  input.appendChild(etcInput);

  grid.appendChild(input);
  grid.appendChild(outputPanel('cva','CVA 환자 차팅'));
  container.appendChild(grid);
  setOutput('cva', buildCvaText());

  function plegiaLabel(locArr){
    if(!locArr.length) return '(부위 선택)';
    const has = (x)=>locArr.includes(x);
    if(has('Rt. UE') && has('Rt. LE') && has('Lt. UE') && has('Lt. LE')) return 'Quadriplegia (Rt./Lt. UE/LE)';
    if(has('Rt. UE') && has('Rt. LE') && !has('Lt. UE') && !has('Lt. LE')) return 'Rt. hemiplegia';
    if(has('Lt. UE') && has('Lt. LE') && !has('Rt. UE') && !has('Rt. LE')) return 'Lt. hemiplegia';
    if(has('Rt. LE') && has('Lt. LE') && !has('Rt. UE') && !has('Lt. UE')) return 'Paraplegia (B/L LE)';
    if(locArr.length === 1) return locArr[0] + ' monoplegia';
    return locArr.join(', ') + ' plegia';
  }
  function buildCvaText(){
    const plegiaLocText = plegiaLabel(c.plegiaLoc);
    const plegiaGradeText = c.plegiaGrade || '(등급 선택)';
    const speechText = c.speech.length ? c.speech.join(' / ') : '(선택)';
    return `1. Mental Gr. ${c.mental || '(선택)'}
2. ${plegiaLocText} (${plegiaGradeText})
3. ${speechText}
4. Dysphagia (${c.dysphagia || '(선택)'})
5. Dysuria (${c.dysuria || '(선택)'})
6. Dyspnea (${c.dyspnea || '(선택)'})
7. 기타 호소 증상: ${c.etc || '(입력)'}`;
  }
}

// 8. 유의사항 (탭별 차팅과 무관한 행정/정책 참고자료)
state.activeRefCategory = state.activeRefCategory || Object.keys(REFERENCE_NOTES)[0];
state.refSearchQuery = state.refSearchQuery || '';
renderers.referenceNotes = function(container){
  container.innerHTML = '';
  const wrap = el('div','input-panel');
  wrap.appendChild(el('div','section-title','■ 유의사항 — 차팅과 무관한 행정/정책 참고 메모'));
  wrap.appendChild(el('div','desc-line','* 실제 차팅 문구가 아닌, 진료·청구 시 참고할 잡다한 유의사항 모음입니다. 최신 항목이 위에 먼저 표시됩니다.'));

  const searchRow = el('div');
  searchRow.style.cssText = 'display:flex;gap:8px;margin-bottom:14px;';
  const searchInput = el('input','text-input');
  searchInput.type = 'text';
  searchInput.placeholder = '유의사항 전체에서 검색 (예: 도수, 산재, 소아 ...)';
  searchInput.value = state.refSearchQuery;
  searchInput.style.marginBottom = '0';
  searchInput.style.flex = '1';
  searchInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ state.refSearchQuery = e.target.value; renderers.referenceNotes(container); } };
  searchRow.appendChild(searchInput);
  const searchBtn = el('button', null, '검색');
  searchBtn.style.cssText = 'background:#0d9488;color:#fff;border:none;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;';
  searchBtn.onclick = ()=>{ state.refSearchQuery = searchInput.value; renderers.referenceNotes(container); };
  searchRow.appendChild(searchBtn);
  wrap.appendChild(searchRow);

  function escapeRegExp(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function buildItemEl(item, highlightQuery){
    const li = el('li');
    li.style.cssText = 'padding:9px 0;border-bottom:1px dashed var(--border-color);';
    const textSpan = el('span');
    if(highlightQuery){
      const re = new RegExp('(' + escapeRegExp(highlightQuery) + ')', 'gi');
      textSpan.innerHTML = item.t.replace(re, '<mark style="background:#fef08a;color:#1e293b;padding:0 1px;border-radius:2px;">$1</mark>') + ' ';
    } else {
      textSpan.textContent = item.t + ' ';
    }
    li.appendChild(textSpan);
    const dateSpan = el('span', null, item.l);
    dateSpan.style.cssText = 'color:#94a3b8;font-size:10.5px;white-space:nowrap;';
    li.appendChild(dateSpan);
    return li;
  }

  const query = state.refSearchQuery.trim();

  if(query){
    let totalHits = 0;
    Object.keys(REFERENCE_NOTES).forEach(cat=>{
      const hits = REFERENCE_NOTES[cat].filter(item=> item.t.toLowerCase().includes(query.toLowerCase()));
      if(hits.length === 0) return;
      totalHits += hits.length;
      wrap.appendChild(el('div','section-title','▸ '+cat+' ('+hits.length+'건)'));
      const list = el('ol');
      list.style.cssText = 'padding-left:20px;line-height:1.7;font-size:13px;margin-bottom:14px;';
      hits.forEach(item=>{ list.appendChild(buildItemEl(item, query)); });
      wrap.appendChild(list);
    });
    if(totalHits === 0){
      wrap.appendChild(el('div','desc-line','검색 결과가 없습니다.'));
    }
    container.appendChild(wrap);
    return;
  }

  const subBar = el('div','subtab-bar');
  Object.keys(REFERENCE_NOTES).forEach(cat=>{
    const b = el('button','subtab-btn'+(state.activeRefCategory===cat?' active':''), cat);
    b.type='button';
    b.onclick = ()=>{ state.activeRefCategory = cat; renderers.referenceNotes(container); };
    subBar.appendChild(b);
  });
  wrap.appendChild(subBar);
  const list = el('ol');
  list.style.cssText = 'padding-left:20px;line-height:1.7;font-size:13px;';
  REFERENCE_NOTES[state.activeRefCategory].forEach(item=>{
    list.appendChild(buildItemEl(item));
  });
  wrap.appendChild(list);
  container.appendChild(wrap);
};

function switchTab(tabId){
  document.querySelectorAll('#tabBar .tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tabbtn-'+tabId).classList.add('active');
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  const wrap = el('div','tab-content active');
  wrap.id = 'tab-'+tabId;
  main.appendChild(wrap);
  renderers[tabId](wrap);
}

function init(){
  const bar = document.getElementById('tabBar');
  TABS.forEach((t,i)=>{
    const b = el('button','tab-btn'+(i===0?' active':''), t.label);
    b.id = 'tabbtn-'+t.id;
    b.onclick = ()=>switchTab(t.id);
    bar.appendChild(b);
  });
  switchTab(TABS[0].id);
}
const RAW_SOURCE_URLS = [
  "https://raw.githubusercontent.com/CJHtools/CJHcharting/main/index.html",
  "https://raw.githubusercontent.com/CJHtools/CJHcharting/master/index.html"
];

async function fetchLatestSource(){
  if(location.protocol !== 'file:'){
    const res = await fetch(location.href, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }
  // 로컬(file://)에서 실행 중인 경우 -> 고정된 GitHub 원본 주소에서 직접 최신본을 시도
  let lastErr;
  for(const src of RAW_SOURCE_URLS){
    try{
      const res = await fetch(src + '?_t=' + Date.now(), { cache: 'no-store' });
      if(res.ok) return res.text();
      lastErr = new Error('HTTP ' + res.status + ' from ' + src);
      console.warn('시도 실패:', src, res.status);
    } catch(e){
      lastErr = e;
      console.warn('시도 중 오류:', src, e);
    }
  }
  throw lastErr || new Error('모든 주소 시도 실패');
}

// GitHub 커밋 기록에서 index.html의 최신 수정일(YYYY-MM-DD)을 직접 조회 (수동 갱신 불필요)
async function getLatestCommitDate(){
  const res = await fetch(GH_COMMITS_API, { cache: 'no-store' });
  if(!res.ok) throw new Error('GitHub API HTTP ' + res.status);
  const data = await res.json();
  if(!data || !data[0] || !data[0].commit) throw new Error('커밋 정보 없음');
  const iso = data[0].commit.committer.date || data[0].commit.author.date;
  return iso.slice(0,10);
}

async function updateHeaderDate(){
  const span = document.getElementById('lastModifiedSpan');
  if(!span) return;
  if(LOCAL_SNAPSHOT_DATE){
    // 오프라인 저장본: 저장 시점에 이미 기록해둔 날짜를 그대로 표시(네트워크 불필요)
    span.textContent = '최종 수정: ' + LOCAL_SNAPSHOT_DATE + ' (오프라인 저장본)';
    return;
  }
  try{
    const d = await getLatestCommitDate();
    span.textContent = '최종 수정: ' + d;
    try{ localStorage.setItem('chartToolLastCommitDate', d); } catch(e){}
  } catch(e){
    console.warn('최종수정일 조회 실패:', e);
    let cached = null;
    try{ cached = localStorage.getItem('chartToolLastCommitDate'); } catch(e2){}
    span.textContent = cached ? ('최종 수정: ' + cached + ' (오프라인 캐시)') : '최종 수정: 확인 불가';
  }
}

async function saveOfflineCopy(){
  const btn = document.getElementById('offlineSaveBtn');
  const original = btn.textContent;
  try{
    const text = await fetchLatestSource();
    let snapshotDate = null;
    try{ snapshotDate = await getLatestCommitDate(); } catch(e){ /* 실패해도 저장은 계속 진행 */ }
    let finalText = text;
    if(snapshotDate){
      // 다운로드되는 사본에 "저장 시점의 최신 커밋 날짜"를 그대로 새겨넣음 -> 이후 이 사본을 열면 그 날짜가 고정 표시됨
      finalText = text.replace('let LOCAL_SNAPSHOT_DATE = null;', 'let LOCAL_SNAPSHOT_DATE = "' + snapshotDate + '";');
    }
    const blob = new Blob([finalText], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tag_charting_tool_offline.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    btn.textContent = '✅ 저장 완료! (다운로드 폴더 확인 — 이 파일은 인터넷 없이도 단독 실행됩니다)';
    setTimeout(()=>{ btn.textContent = original; }, 4000);
  } catch(e){
    console.error('오프라인 저장 실패:', e);
    btn.textContent = location.protocol === 'file:'
      ? '⚠ 오프라인 상태로 보입니다 — 인터넷 연결 시 다시 시도해주세요'
      : '⚠ 저장 실패 — 인터넷 연결 확인 후 다시 시도해주세요';
    setTimeout(()=>{ btn.textContent = original; }, 3500);
  }
}
document.getElementById('offlineSaveBtn').onclick = saveOfflineCopy;

async function checkForUpdateBadge(attempt){
  attempt = attempt || 1;
  if(location.protocol !== 'file:') return; // 웹 버전은 항상 최신이므로 체크 불필요
  const badge = document.getElementById('updateBadge');
  if(attempt === 1){
    // 첫 시도 시작 시 "확인 중" 상태로 표시
    badge.style.display = 'inline-block';
    badge.style.background = '#94a3b8';
    badge.textContent = '확인중';
    badge.title = '업데이트 확인 중...';
  }
  if(!LOCAL_SNAPSHOT_DATE){
    // 저장 시점 정보가 없는(구버전 방식으로 저장된) 사본 -> 비교 불가, 조용히 종료
    badge.style.display = 'none';
    return;
  }
  try{
    const remoteDate = await getLatestCommitDate();
    if(remoteDate > LOCAL_SNAPSHOT_DATE){
      badge.style.display = 'inline-block';
      badge.style.background = '#e74c3c';
      badge.textContent = '새 버전!';
      badge.title = '새 버전(' + remoteDate + ')이 있습니다. "오프라인 저장"을 눌러 최신본을 받아주세요.';
    } else {
      badge.style.display = 'inline-block';
      badge.style.background = '#16a34a';
      badge.textContent = '최신버전';
      badge.title = '최신 버전입니다. (' + LOCAL_SNAPSHOT_DATE + ')';
    }
  } catch(e){
    console.error('업데이트 확인 실패(시도 ' + attempt + '/3):', e);
    if(attempt < 3){
      // 재시도 예정 -> "확인 중" 상태 유지
      badge.style.display = 'inline-block';
      badge.style.background = '#94a3b8';
      badge.textContent = '확인중';
      badge.title = '업데이트 확인 중... (' + attempt + '/3)';
      setTimeout(()=>{ checkForUpdateBadge(attempt + 1); }, 2000);
      return;
    }
    // 3회 모두 실패한 경우에만 "연결 안됨"으로 확정 표시
    badge.style.display = 'inline-block';
    badge.style.background = '#475569';
    badge.textContent = '연결안됨';
    badge.title = '인터넷 연결 안됨 — 업데이트 여부를 확인할 수 없습니다. (' + (e && e.message ? e.message : e) + ')';
  }
}

init();
</script>
